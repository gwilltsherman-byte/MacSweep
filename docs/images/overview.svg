<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">MacSweep — review your Mac’s space before removing files</title>
<desc id="desc">A product overview graphic showing three steps: review files, choose what to remove, and confirm cleanup. Files go to the Trash by default. MacSweep runs on macOS 13 or later.</desc>
<rect width="1280" height="720" fill="#f4f7fb"/>
<path d="M0 0H1280V12H0Z" fill="#147cf8"/>
<g font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" fill="#172438">
<rect x="72" y="68" width="70" height="70" rx="18" fill="#147cf8"/>
<path d="m107 81 6 20 20 6-20 6-6 20-6-20-20-6 20-6Z" fill="white"/>
<text x="162" y="126" font-size="62" font-weight="750" letter-spacing="-2">MacSweep</text>
<text x="72" y="197" font-size="30" fill="#485b72">See what is taking up space before removing it.</text>
<g transform="translate(72 251)">
<rect width="354" height="303" rx="20" fill="white" stroke="#dce4ed"/>
<g transform="translate(28 29)" fill="none" stroke="#147cf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
<path d="M2 16V4h27l12 12h31v43H2Z"/><path d="M2 16h70"/><path d="M24 29h25M24 42h18"/>
</g>
<text x="28" y="137" font-size="27" font-weight="700">Review your files</text>
<text x="28" y="180" font-size="20" fill="#52647a">Caches, unused apps,</text>
<text x="28" y="211" font-size="20" fill="#52647a">build folders and large files.</text>
<text x="28" y="266" font-size="16" font-weight="600" fill="#147cf8">Understand what each item is.</text>
</g>
<g transform="translate(464 251)">
<rect width="354" height="303" rx="20" fill="white" stroke="#dce4ed"/>
<g transform="translate(28 29)" fill="none" stroke="#147cf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
<rect x="2" y="3" width="24" height="24" rx="5"/><path d="m8 15 5 5 9-12M38 15h33"/>
<rect x="2" y="38" width="24" height="24" rx="5"/><path d="M38 50h33"/>
</g>
<text x="28" y="137" font-size="27" font-weight="700">Choose what to remove</text>
<text x="28" y="180" font-size="20" fill="#52647a">Read the explanation</text>
<text x="28" y="211" font-size="20" fill="#52647a">and select the items yourself.</text>
<text x="28" y="266" font-size="16" font-weight="600" fill="#147cf8">Safe · Check first · Careful</text>
</g>
<g transform="translate(856 251)">
<rect width="352" height="303" rx="20" fill="white" stroke="#dce4ed"/>
<g transform="translate(28 29)" fill="none" stroke="#147cf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
<rect x="2" y="3" width="54" height="61" rx="8"/><path d="M16 16h26M16 27h26M16 38h15"/><path d="m37 51 8 8 17-20"/>
</g>
<text x="28" y="137" font-size="27" font-weight="700">Confirm the cleanup</text>
<text x="28" y="180" font-size="20" fill="#52647a">Review the summary</text>
<text x="28" y="211" font-size="20" fill="#52647a">before anything is removed.</text>
<text x="28" y="266" font-size="16" font-weight="600" fill="#147cf8">Files go to the Trash by default.</text>
</g>
<path d="M435 401h18m-6-6 6 6-6 6M827 401h18m-6-6 6 6-6 6" fill="none" stroke="#8191a5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="72" y="623" font-size="24" font-weight="600">Nothing is removed without your confirmation.</text>
<text x="72" y="667" font-size="18" fill="#617187">macOS 13 or later · Apple silicon download · Native Mac app</text>
<text x="1208" y="667" font-size="15" fill="#617187" text-anchor="end">Product overview graphic</text>
</g>
</svg>